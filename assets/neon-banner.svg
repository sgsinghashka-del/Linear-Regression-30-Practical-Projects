<svg width="1400" height="520" viewBox="0 0 1400 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Linear Regression 30 Practical Projects</title>
  <desc id="desc">Dark neon GitHub-style banner showing regression lines and project metrics.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050816"/><stop offset="0.52" stop-color="#0b1230"/><stop offset="1" stop-color="#1a0835"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#22d3ee"/><stop offset="1" stop-color="#60a5fa"/></linearGradient>
    <linearGradient id="pink" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#f472b6"/><stop offset="1" stop-color="#c084fc"/></linearGradient>
    <filter id="glow-cyan"><feGaussianBlur stdDeviation="7" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="glow-pink"><feGaussianBlur stdDeviation="8" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0V42" fill="none" stroke="#64748b" stroke-opacity=".13"/></pattern>
  </defs>
  <rect width="1400" height="520" rx="26" fill="url(#background)"/>
  <rect width="1400" height="520" rx="26" fill="url(#grid)"/>
  <circle cx="1190" cy="80" r="230" fill="#7c3aed" opacity=".12"/><circle cx="180" cy="470" r="250" fill="#06b6d4" opacity=".08"/>

  <g font-family="Arial, Helvetica, sans-serif">
    <text x="86" y="128" fill="#94a3b8" font-size="20" letter-spacing="5">MACHINE LEARNING PORTFOLIO</text>
    <text x="82" y="205" fill="#f8fafc" font-size="64" font-weight="800">Linear Regression</text>
    <text x="86" y="270" fill="url(#cyan)" font-size="58" font-weight="800">30 Practical Projects</text>
    <text x="88" y="320" fill="#cbd5e1" font-size="20">A reproducible, visual introduction to interpretable regression.</text>

    <g transform="translate(88 372)">
      <rect width="150" height="64" rx="14" fill="#0f1b3d" stroke="#22d3ee" stroke-opacity=".7"/>
      <text x="22" y="27" fill="#94a3b8" font-size="14">PROJECTS</text><text x="22" y="51" fill="#f8fafc" font-size="23" font-weight="700">30</text>
      <rect x="170" width="150" height="64" rx="14" fill="#0f1b3d" stroke="#a78bfa" stroke-opacity=".7"/>
      <text x="192" y="27" fill="#94a3b8" font-size="14">MODEL</text><text x="192" y="51" fill="#f8fafc" font-size="23" font-weight="700">OLS</text>
      <rect x="340" width="150" height="64" rx="14" fill="#0f1b3d" stroke="#34d399" stroke-opacity=".7"/>
      <text x="362" y="27" fill="#94a3b8" font-size="14">METRICS</text><text x="362" y="51" fill="#f8fafc" font-size="23" font-weight="700">MAE · RMSE</text>
    </g>

    <g transform="translate(760 78)">
      <rect width="550" height="350" rx="22" fill="#070d22" stroke="#334155" stroke-width="2"/>
      <text x="32" y="45" fill="#cbd5e1" font-size="18">actual vs predicted</text>
      <path d="M48 282H510M48 282V70" stroke="#64748b" stroke-opacity=".7"/>
      <path d="M70 260L135 240L195 225L260 188L325 164L390 117L455 92L490 75" fill="none" stroke="url(#cyan)" stroke-width="5" stroke-linecap="round" filter="url(#glow-cyan)"/>
      <path d="M70 260L135 248L195 218L260 200L325 172L390 140L455 110L490 95" fill="none" stroke="url(#pink)" stroke-width="4" stroke-linecap="round" filter="url(#glow-pink)" opacity=".9"/>
      <g fill="#e2e8f0"><circle cx="70" cy="260" r="5"/><circle cx="135" cy="240" r="5"/><circle cx="195" cy="225" r="5"/><circle cx="260" cy="188" r="5"/><circle cx="325" cy="164" r="5"/><circle cx="390" cy="117" r="5"/><circle cx="455" cy="92" r="5"/><circle cx="490" cy="75" r="5"/></g>
      <text x="48" y="320" fill="#64748b" font-size="14">low feature value</text><text x="390" y="320" fill="#64748b" font-size="14">high feature value</text>
    </g>
  </g>
</svg>
