<svg width="1000" height="700" viewBox="0 0 1000 700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1c0f2b"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="700" fill="url(#bg)" rx="24"/>
  <text x="70" y="90" fill="#f8fafc" font-size="34" font-weight="700" font-family="Arial, Helvetica, sans-serif">Student Marks Prediction</text>
  <text x="70" y="122" fill="#fbbf24" font-size="18" font-family="Arial, Helvetica, sans-serif">Study Hours + Attendance + Assignments → Marks</text>

  <g>
    <rect x="70" y="180" width="260" height="120" rx="18" fill="#1d2236" stroke="#fbbf24"/>
    <text x="95" y="220" fill="#94a3b8" font-size="16" font-family="Arial, Helvetica, sans-serif">Study Hours</text>
    <text x="95" y="260" fill="#f8fafc" font-size="34" font-weight="700" font-family="Arial, Helvetica, sans-serif">+3.26</text>
  </g>

  <g>
    <rect x="370" y="180" width="260" height="120" rx="18" fill="#1d2236" stroke="#f472b6"/>
    <text x="395" y="220" fill="#94a3b8" font-size="16" font-family="Arial, Helvetica, sans-serif">Attendance</text>
    <text x="395" y="260" fill="#f8fafc" font-size="34" font-weight="700" font-family="Arial, Helvetica, sans-serif">+0.49</text>
  </g>

  <g>
    <rect x="670" y="180" width="260" height="120" rx="18" fill="#1d2236" stroke="#34d399"/>
    <text x="695" y="220" fill="#94a3b8" font-size="16" font-family="Arial, Helvetica, sans-serif">Assignments</text>
    <text x="695" y="260" fill="#f8fafc" font-size="34" font-weight="700" font-family="Arial, Helvetica, sans-serif">+1.24</text>
  </g>

  <g>
    <rect x="70" y="340" width="860" height="260" rx="24" fill="#171e2e" stroke="#334155"/>
    <path d="M110 560 L220 530 L330 510 L440 465 L550 425 L660 365 L770 290 L860 220" stroke="url(#line)" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <g fill="#cbd5e1" font-size="14" font-family="Arial, Helvetica, sans-serif">
      <text x="100" y="610">0</text>
      <text x="310" y="610">5</text>
      <text x="520" y="610">10</text>
      <text x="735" y="610">15</text>
    </g>
  </g>
