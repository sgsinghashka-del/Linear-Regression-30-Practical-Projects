<svg width="1400" height="560" viewBox="0 0 1400 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Linear Regression 30 Practical Projects</title>
  <desc id="desc">Cinematic dark neon machine learning banner with glowing regression curves, data points, and project statistics.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#030712"/><stop offset=".45" stop-color="#0b1230"/><stop offset="1" stop-color="#21052d"/></linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#22d3ee"/><stop offset="1" stop-color="#38bdf8"/></linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#a78bfa"/><stop offset="1" stop-color="#f472b6"/></linearGradient>
    <radialGradient id="orb"><stop stop-color="#8b5cf6" stop-opacity=".38"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient>
    <filter id="cyanGlow"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="pinkGlow"><feGaussianBlur stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#94a3b8" stroke-opacity=".1"/></pattern>
  </defs>
  <rect width="1400" height="560" rx="30" fill="url(#bg)"/>
  <rect width="1400" height="560" rx="30" fill="url(#grid)"/>
  <ellipse cx="1170" cy="90" rx="350" ry="280" fill="url(#orb)"/>
  <ellipse cx="120" cy="530" rx="330" ry="220" fill="#06b6d4" opacity=".08"/>
  <path d="M0 470C290 390 410 540 690 430S1110 320 1400 395" fill="none" stroke="#22d3ee" stroke-opacity=".08" stroke-width="2"/>

  <g font-family="Arial, Helvetica, sans-serif">
    <text x="82" y="112" fill="#67e8f9" font-size="18" font-weight="700" letter-spacing="6">AN INTERPRETABLE ML FIELD GUIDE</text>
    <text x="78" y="198" fill="#f8fafc" font-size="65" font-weight="800">Linear Regression</text>
    <text x="82" y="268" fill="url(#cyan)" font-size="60" font-weight="800">30 Practical Projects</text>
    <text x="84" y="318" fill="#cbd5e1" font-size="20">From features to forecasts — a visual, reproducible notebook journey.</text>

    <g transform="translate(84 376)">
      <rect width="155" height="70" rx="16" fill="#08132f" stroke="#22d3ee" stroke-opacity=".75"/>
      <text x="22" y="28" fill="#94a3b8" font-size="13" letter-spacing="2">CASE STUDIES</text><text x="22" y="57" fill="#f8fafc" font-size="26" font-weight="800">30</text>
      <rect x="175" width="155" height="70" rx="16" fill="#08132f" stroke="#a78bfa" stroke-opacity=".75"/>
      <text x="197" y="28" fill="#94a3b8" font-size="13" letter-spacing="2">ESTIMATOR</text><text x="197" y="57" fill="#f8fafc" font-size="26" font-weight="800">OLS</text>
      <rect x="350" width="185" height="70" rx="16" fill="#08132f" stroke="#34d399" stroke-opacity=".75"/>
      <text x="372" y="28" fill="#94a3b8" font-size="13" letter-spacing="2">DIAGNOSTICS</text><text x="372" y="57" fill="#f8fafc" font-size="26" font-weight="800">MAE · RMSE · R²</text>
    </g>

    <g transform="translate(760 62)">
      <rect width="560" height="390" rx="25" fill="#050a1d" stroke="#334155" stroke-width="2"/>
      <text x="34" y="48" fill="#e2e8f0" font-size="18" font-weight="600">signal extraction / prediction surface</text>
      <path d="M50 332H520M50 332V78" stroke="#64748b" stroke-opacity=".65"/>
      <path d="M72 302L132 284L190 266L250 232L310 210L370 164L430 119L490 96" fill="none" stroke="url(#cyan)" stroke-width="5" stroke-linecap="round" filter="url(#cyanGlow)"/>
      <path d="M72 302L132 291L190 270L250 249L310 218L370 188L430 151L490 124" fill="none" stroke="url(#violet)" stroke-width="4" stroke-linecap="round" filter="url(#pinkGlow)" opacity=".95"/>
      <g fill="#f8fafc"><circle cx="72" cy="302" r="5"/><circle cx="132" cy="284" r="5"/><circle cx="190" cy="266" r="5"/><circle cx="250" cy="232" r="5"/><circle cx="310" cy="210" r="5"/><circle cx="370" cy="164" r="5"/><circle cx="430" cy="119" r="5"/><circle cx="490" cy="96" r="5"/></g>
      <text x="52" y="365" fill="#64748b" font-size="14">observed feature space</text><text x="388" y="365" fill="#64748b" font-size="14">predicted response</text>
    </g>
  </g>
</svg>
